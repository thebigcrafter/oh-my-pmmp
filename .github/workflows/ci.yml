name: Run static analysis and code style checks

on:
  push:
  pull_request:

jobs:
  phpstan:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP 8.2 environment
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
        with:
          php-version: 8.2
          install-path: "./bin"
          pm-version-major: "5"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          composer-options: --ignore-platform-req=ext-webrtc

      - name: Run PHPStan at maximum level
        run: composer run-script analyse

  codestyle:
    name: Check PHP code style
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP 8.1 environment
        uses: shivammathur/setup-php@3bdfe21000ea9539e3a94c4f692f984b24fa97e0
        with:
          php-version: 8.1
          tools: php-cs-fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PHP code style
        run: php-cs-fixer fix --dry-run --ansi --diff
