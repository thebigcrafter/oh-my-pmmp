name: Run static analysis and code style checks

on:
  push:
  pull_request:

jobs:
  phpstan:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP 8.2 environment
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
        with:
          php-version: 8.2
          install-path: "./bin"
          pm-version-major: "5"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@1919f6c305aea6ab10e6181a8ddf72317ad77e0e

      - name: Run PHPStan at maximum level
        run: composer run-script analyse

  codestyle:
    name: Check PHP code style
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP 8.1 environment
        uses: shivammathur/setup-php@8111a99597b62a73e9445b0d625ea6c4c82c0a04
        with:
          php-version: 8.1
          tools: php-cs-fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PHP code style
        run: php-cs-fixer fix --dry-run --ansi --diff
