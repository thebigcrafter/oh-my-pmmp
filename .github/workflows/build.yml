name: Build and validate plugin

on:
  push:

jobs:
  build-phar:
    name: Build and validate plugin
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP 8.2 environment
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
        with:
          php-version: 8.2
          install-path: "./bin"
          pm-version-major: "5"
  
      - name: Build plugin PHAR with Pharynx
        uses: SOF3/pharynx@6926183c038643556b2cb2609e01fd18004794fe
        id: pharynx
        with:
          pharynx-version: "0.3.6"

      - name: Rename generated plugin PHAR
        run: mv ${{steps.pharynx.outputs.output-phar}} ./oh-my-pmmp.phar
            
      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oh-my-pmmp
          path: ./oh-my-pmmp.phar
