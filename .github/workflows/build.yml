name: Build plugin PHAR

on:
  push:

jobs:
  build-phar:
    name: Build plugin PHAR
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2 environment
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
        with:
          php-version: 8.2
          install-path: "./bin"
          pm-version-major: "5"
  
      - name: Build plugin PHAR with Pharynx
        uses: SOF3/pharynx@v0.1
        id: pharynx
        with:
          pharynx-version: "0.3.6"

      - name: Rename generated plugin PHAR
        run: mv ${{steps.pharynx.outputs.output-phar}} ./oh-my-pmmp.phar
            
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-pmmp
          path: ./oh-my-pmmp.phar
